<!doctype html>
<html><head><meta charset="utf-8"><title>perf</title>
<style>html,body{margin:0;background:#000;color:#0f0;font:12px monospace}#c{width:900px;height:600px}#stats{position:fixed;left:0;top:0;white-space:pre}</style></head>
<body><div id="c"></div><pre id="stats">init</pre>
<script>
// Perf probe: same player as the game page, options via query string:
//   ?swf=game.swf&quality=high|medium|low&renderer=wgpu-webgl|webgl&w=900
// Records requestAnimationFrame intervals; window.__perf.mark() starts a measurement window.
const q = new URLSearchParams(location.search);
const cfg = {autoplay:"on",unmuteOverlay:"hidden",splashScreen:false,letterbox:"on",logLevel:"warn",
  fontSources:["fonts/NanumGothic-Regular.ttf","fonts/NanumGothic-Bold.ttf"],
  defaultFonts:{sans:["NanumGothic"],serif:["NanumGothic"],typewriter:["NanumGothic"]}};
if (q.get("quality")) cfg.quality = q.get("quality");
if (q.get("renderer")) cfg.preferredRenderer = q.get("renderer");
window.RufflePlayer = {config: cfg};
</script>
<script src="ruffle/ruffle.js"></script>
<script>
const w = +(q.get("w") || 900), c = document.getElementById("c");
c.style.width = w + "px"; c.style.height = (w * 2 / 3) + "px";
const k = +(q.get("k") || 1);  // CSS upscale of a fixed-size render box
if (k !== 1) { c.style.transform = `scale(${k})`; c.style.transformOrigin = "0 0"; }
const p = window.RufflePlayer.newest().createPlayer();
p.style.width = "100%"; p.style.height = "100%";
c.appendChild(p); p.load({url: q.get("swf") || "game.swf", base: "./"});
const start = +(q.get("start") || 40), dur = +(q.get("dur") || 15);
const st = {t0: performance.now(), dts: [], last: performance.now(), marked: null};
window.__perf = st;
function tick(now) {
  const dt = now - st.last; st.last = now;
  if (st.marked !== null && now - st.marked < dur * 1000) st.dts.push(dt);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
// start measuring after `start` seconds, measure for `dur` seconds

setTimeout(() => { st.marked = performance.now(); st.dts = []; }, start * 1000);
setInterval(() => {
  const d = st.dts.slice().sort((a, b) => a - b), n = d.length;
  const el = st.marked ? Math.min(dur, (performance.now() - st.marked) / 1000) : 0;
  const fps = n ? (n / (d.reduce((a, b) => a + b, 0) / 1000)) : 0;
  const pct = k => n ? d[Math.min(n - 1, Math.floor(n * k))].toFixed(1) : "-";
  document.getElementById("stats").textContent =
    `PERF q=${cfg.quality||"default"} r=${cfg.preferredRenderer||"default"} swf=${q.get("swf")||"game.swf"} w=${w} k=${k}\n` +
    `window=${el.toFixed(1)}s frames=${n} fps=${fps.toFixed(1)} p50=${pct(.5)}ms p95=${pct(.95)}ms max=${n?d[n-1].toFixed(1):"-"}ms ` +
    `jank>50ms=${d.filter(x => x > 50).length} jank>100ms=${d.filter(x => x > 100).length}` +
    (el >= dur ? " DONE" : "");
}, 500);
</script></body></html>
