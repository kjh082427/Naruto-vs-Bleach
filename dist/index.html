<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블리치 VS 나루토 VS 원피스 1.3</title>
<meta name="theme-color" content="#0f0f23">
<link rel="preload" href="assets/gothica1-700.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="assets/hahmlet-900.woff" as="font" type="font/woff" crossorigin>
<style>
/* Self-hosted subsets (OFL, see assets/OFL-*.txt), regenerated by work/design/render_web.py */
@font-face{font-family:"Hahmlet";src:url(assets/hahmlet-900.woff) format("woff");font-weight:900;font-display:swap}
@font-face{font-family:"Gothic A1";src:url(assets/gothica1-500.woff) format("woff");font-weight:500;font-display:swap}
@font-face{font-family:"Gothic A1";src:url(assets/gothica1-700.woff) format("woff");font-weight:700;font-display:swap}

:root{
  --night:#0f0f23;      /* deep navy-black, the ground of the game art */
  --moon:#eee9df;       /* moon-paper white: primary text */
  --steel:#8e97ab;      /* secondary text (6.4:1 on --night) */
  --ice:#a0c4e8;        /* Bleach: cold moon-white / ice blue */
  --ember:#f97316;      /* Naruto: ember orange; also 2P keys and focus (6.7:1) */
  --red:#f43f5e;        /* One Piece: straw-hat red (5.1:1) ... */
  --gold:#facc15;       /* ... and straw gold */
  --seal:#be241d;       /* the edition stamp, used once */
  --line:rgba(238,233,223,.14);
  --vh:100vh;
  --pad:clamp(10px,2.2vmin,24px);
  --rail:14.5rem;
  --gap:clamp(16px,2.4vw,36px);
  color-scheme:dark;
}
@supports (height:100dvh){:root{--vh:100dvh}}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{font-size:16px}
@media (min-width:1600px) and (min-height:860px){html{font-size:18px}}
body{
  background:linear-gradient(180deg,#17192f 0%,var(--night) 52%,#08080f 100%) fixed;
  color:var(--moon);
  font:500 0.8125rem/1.5 "Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  word-break:keep-all;overflow-wrap:anywhere;
  overflow:hidden;
}

/* Landscape: instruction card on the left, the game takes every remaining pixel at 3:2.
   .stage is the fitted on-screen box (CSS decides its size). The Ruffle player lives in .render,
   laid out at most 900x600 and scaled up with a transform (see fit() below): Ruffle's cost grows
   with the player's layout size, so a 900-wide render box upscaled by the compositor is much faster. */
.layout{
  min-height:var(--vh);
  padding:var(--pad);
  display:flex;align-items:center;justify-content:center;gap:var(--gap);
}
.stage{
  flex:none;position:relative;overflow:hidden;
  width:min(calc(100% - var(--rail) - var(--gap)), calc((var(--vh) - 2 * var(--pad)) * 1.5), 1680px);
  aspect-ratio:3/2;
  background:#000;
  outline:1px solid var(--line);
}
.stage:focus-within{outline:2px solid var(--ember);outline-offset:1px}
.stage:fullscreen{width:100%;height:100%;aspect-ratio:auto;outline:0}
.stage::backdrop{background:#000}
.render{position:absolute;left:0;top:0;width:900px;height:600px;transform-origin:0 0}
.render>*{display:block;width:100%;height:100%}

.rail{
  flex:none;width:var(--rail);
  max-height:calc(var(--vh) - 2 * var(--pad));
  overflow:auto;
  display:flex;flex-direction:column;gap:1.375rem;
}

/* Title lockup: the three names stepped down one diagonal, as on the in-game title. Every block leans the same
   way as the panels in the game art; each faction keeps one accent. */
.lockup{margin:0;display:grid;gap:0.3125rem;font-family:"Hahmlet",serif;font-weight:900;line-height:1}
.factions{display:flex;gap:5px;margin:0 0.375rem 0.875rem 0.25rem}
.factions i{flex:1;height:5px;transform:skewX(-34deg)}
.factions i:nth-child(1){background:var(--ice)}
.factions i:nth-child(2){background:var(--ember)}
.factions i:nth-child(3){background:linear-gradient(90deg,var(--red) 0 72%,var(--gold) 72%)}
.lockup .name{position:relative;justify-self:start;font-size:2.625rem;letter-spacing:.02em;white-space:nowrap}
.lockup .bleach{margin-left:0.125rem;color:#eef2f8;
  background:linear-gradient(180deg,#f4f7fb 30%,var(--ice));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lockup .naruto{margin-left:2.375rem;color:var(--ember)}
.lockup .onepiece{margin-left:4.625rem;color:var(--red)}
.vs{position:absolute;right:100%;top:50%;margin-right:0.4375rem;transform:translateY(-46%);
  font-size:0.6875rem;letter-spacing:.12em;color:var(--moon);-webkit-text-fill-color:var(--moon)}
.edition{display:flex;align-items:center;gap:0.5625rem;margin:0.75rem 0 0 4.75rem;font-size:0.9375rem;color:var(--moon)}
.seal{background:var(--seal);font-size:0.8125rem;padding:0.25rem 0.4375rem 0.1875rem;border-radius:2px;letter-spacing:.06em}
.roster{margin:-0.5rem 0 0;font-size:0.6875rem;line-height:1.6;color:var(--steel);word-spacing:0.25rem}
.roster b{font-weight:700;color:var(--moon)}
.roster span{white-space:nowrap;word-spacing:0}
.roster span::before{content:"";display:inline-block;width:0.4375rem;height:0.4375rem;margin-right:0.3125rem;
  transform:skewX(-20deg)}
.roster .b::before{background:var(--ice)}
.roster .n::before{background:var(--ember)}
.roster .o::before{background:var(--red)}

/* Controls: laid out like an arcade instruction card. */
.controls{border-top:1px solid var(--line);padding-top:1rem;display:grid;gap:0.875rem}
.head{display:flex;align-items:baseline;justify-content:space-between}
h2{margin:0;font-size:0.875rem;font-weight:700}
.legend{display:flex;gap:0.625rem;font-size:0.6875rem;color:var(--steel)}
.legend b{font-weight:700;color:var(--moon)}
.legend .p2 b{color:var(--ember)}
.row{display:flex;align-items:center;gap:0.625rem;margin:0}
.row dt{width:1.875rem;flex:none;color:var(--steel);font-size:0.75rem}
.row dd{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:0.25rem}
.row .sep{width:0.375rem}
.row .say{color:var(--steel);font-size:0.75rem;margin:0 0.375rem 0 2px}
kbd{
  display:inline-grid;place-items:center;min-width:1.5rem;height:1.5rem;padding:0 0.375rem;
  font:700 0.75rem/1 "Gothic A1",sans-serif;color:var(--moon);
  border:1px solid rgba(238,233,223,.3);border-bottom-width:2px;border-radius:0.3125rem;
}
kbd.p2{color:var(--ember);border-color:rgba(242,128,42,.45)}

.pad{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);row-gap:0.75rem}
.pad li{display:grid;justify-items:center;gap:0.3125rem;font-size:0.75rem;color:var(--steel)}
.btn{position:relative;display:grid;place-items:center;width:2.125rem;height:2.125rem;border-radius:50%;
  border:1.5px solid rgba(238,233,223,.36);font:700 0.875rem/1 "Gothic A1",sans-serif;color:var(--moon)}
.btn i{position:absolute;top:-5px;right:-9px;font:700 0.6875rem/1 "Gothic A1",sans-serif;font-style:normal;color:var(--ember)}

/* Actions */
.actions{border-top:1px solid var(--line);padding-top:1rem;display:grid;gap:0.625rem}
.fs{
  font:700 0.875rem/1 "Gothic A1",sans-serif;color:var(--moon);background:transparent;
  border:1px solid rgba(238,233,223,.36);border-radius:0.375rem;padding:0.6875rem 0.75rem;cursor:pointer;
}
.fs{transition:border-color .15s,color .15s}
.fs:hover{border-color:var(--ember);color:var(--ember)}
.fs:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.hint{margin:0;font-size:0.75rem;color:var(--steel);display:flex;gap:0.4375rem;align-items:baseline}
.hint::before{content:"";flex:none;width:0.375rem;height:0.375rem;border-radius:50%;background:var(--steel);opacity:.6;transform:translateY(-1px)}
.is-playing .hint{color:var(--moon)}
.is-playing .hint::before{background:var(--ember);opacity:1}
.credit{margin:0;font-size:0.6875rem;color:var(--steel);letter-spacing:.04em}

/* 원격 2P (web/netplay.js): data-state idle | hosting | host-live | joining | guest-live */
.remote{border-top:1px solid var(--line);padding-top:1rem;display:grid;gap:0.625rem;align-content:start}
.remote[data-state="idle"] .rp-room,.remote:not([data-state="idle"]) .rp-idle{display:none}
.rp-idle,.rp-room{display:grid;grid-template-columns:minmax(0,1fr);gap:0.5rem}
.rp-join{display:flex;gap:0.375rem;margin:0}
.rp-join .fs{flex:none}
.rp-join input{
  flex:1 1 0;width:0;min-width:0;padding:0.5625rem 0.625rem;
  font:700 0.875rem/1 "Gothic A1",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--moon);
  background:rgba(238,233,223,.05);border:1px solid rgba(238,233,223,.36);border-radius:0.375rem;
}
.rp-join input::placeholder{color:var(--steel);letter-spacing:.04em}
.rp-join input:focus-visible{outline:2px solid var(--ember);outline-offset:1px}
.rp-code{display:flex;align-items:baseline;justify-content:space-between;gap:0.5rem}
.rp-code b{font:700 1.375rem/1 "Gothic A1",sans-serif;letter-spacing:.14em;color:var(--gold)}
.remote[data-state$="-live"] .rp-code b{color:var(--ember)}
.rp-ping{font-size:0.6875rem;color:var(--steel);white-space:nowrap}
.rp-btns{display:flex;gap:0.375rem}
.rp-btns .fs{flex:1;padding:0.5625rem 0.5rem}
.remote:not([data-state="hosting"]):not([data-state="host-live"]) #rp-copy{display:none}
.rp-status{margin:0;font-size:0.75rem;color:var(--steel)}
.rp-status:empty{display:none}
.rp-status.bad{color:var(--red)}
.rp-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.rp-cover{position:absolute;inset:0;margin:0;padding:1rem;display:grid;place-content:center;gap:0.5rem;text-align:center;
  font-size:0.9375rem;color:var(--steel)}
.rp-cover[hidden]{display:none}
.rp-cover b{font-size:1.5rem;letter-spacing:.14em;color:var(--gold)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* Portrait, narrow or very short windows: game on top at full width, card below; page scrolls. */
@media (max-aspect-ratio:4/3),(max-width:820px),(max-height:500px){
  body{overflow:auto}
  .layout{flex-direction:column;justify-content:flex-start}
  .stage{order:-1;width:min(100%, calc((var(--vh) - 2 * var(--pad)) * 1.5))}
  .rail{width:min(100%,47.5rem);max-height:none;overflow:visible;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));column-gap:var(--gap)}
  .controls,.actions,.remote{border-top:0;padding-top:0}
}
</style>
</head>
<body>
<main class="layout">
  <aside class="rail">
    <h1 class="lockup">
      <span class="factions" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="name bleach">블리치</span>
      <span class="name naruto"><span class="vs">VS</span> 나루토</span>
      <span class="name onepiece"><span class="vs">VS</span> 원피스</span>
      <span class="edition">1.3</span>
    </h1>
    <p class="roster"><b>57인</b> <span class="b">블리치 18</span> <span class="n">나루토 22</span> <span class="o">원피스 17</span></p>

    <section class="controls" aria-labelledby="controls-title">
      <div class="head">
        <h2 id="controls-title">조작</h2>
        <span class="legend"><span><b>1P</b> 키보드</span><span class="p2"><b>2P</b> 숫자패드</span></span>
      </div>
      <dl class="row">
        <dt>이동</dt>
        <dd><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span class="sep"></span><kbd class="p2">방향키</kbd></dd>
      </dl>
      <ul class="pad" aria-label="버튼 (1P 키, 2P 숫자패드)">
        <li><span class="btn">U<i>4</i></span>기술</li>
        <li><span class="btn">I<i>5</i></span>필살</li>
        <li><span class="btn">O<i>6</i></span>보조 소환</li>
        <li><span class="btn">J<i>1</i></span>공격</li>
        <li><span class="btn">K<i>2</i></span>점프</li>
        <li><span class="btn">L<i>3</i></span>대시</li>
      </ul>
      <dl class="row">
        <dt>메뉴</dt>
        <dd><kbd>W</kbd><kbd>S</kbd><span class="say">이동</span><kbd>J</kbd><span class="say">선택</span></dd>
      </dl>
    </section>

    <section class="remote" id="remote" data-state="idle" aria-labelledby="remote-title">
      <div class="head">
        <h2 id="remote-title">원격 2P</h2>
        <span class="legend">멀리 있는 친구와 1:1</span>
      </div>
      <div class="rp-idle">
        <button class="fs" id="rp-host" type="button">방 만들기</button>
        <form class="rp-join" id="rp-join">
          <input id="rp-code" name="code" maxlength="6" placeholder="방 코드 6자리" autocomplete="off" spellcheck="false" aria-label="방 코드">
          <button class="fs" type="submit">참가</button>
        </form>
      </div>
      <div class="rp-room">
        <div class="rp-code"><b id="rp-room-code"></b><span class="rp-ping" id="rp-ping"></span></div>
        <div class="rp-btns">
          <button class="fs" id="rp-copy" type="button">링크 복사</button>
          <button class="fs" id="rp-leave" type="button">나가기</button>
        </div>
      </div>
      <p class="rp-status" id="rp-status" role="status"></p>
    </section>

    <section class="actions">
      <button class="fs" id="fullscreen" type="button" title="Esc로 돌아옵니다">전체 화면</button>
      <p class="hint" id="hint" role="status">게임 화면을 한 번 클릭하면 키보드가 연결됩니다.</p>
      <p class="credit">한글화 REA PROJECT</p>
    </section>
  </aside>

  <div class="stage" id="stage"><div class="render" id="render"></div><p class="rp-cover" id="rp-cover" hidden></p></div>
</main>

<script>window.RufflePlayer={config:{"autoplay": "on", "unmuteOverlay": "hidden", "splashScreen": false, "letterbox": "on", "logLevel": "warn", "fontSources": ["fonts/NanumGothic-Regular.ttf", "fonts/NanumGothic-Bold.ttf"], "defaultFonts": {"sans": ["NanumGothic"], "serif": ["NanumGothic"], "typewriter": ["NanumGothic"]}, "quality": "low"}};
// Audio tap for 원격 2P: whatever Ruffle plays into an AudioContext's speakers is also routed into a
// MediaStream (window.__bvnAudioTaps), which netplay.js sends to the guest. Must run before ruffle.js.
(function(){
  if(!window.AudioNode||!window.AudioContext)return;
  const connect=AudioNode.prototype.connect,taps=new WeakMap();
  window.__bvnAudioTaps=[];
  AudioNode.prototype.connect=function(dest){
    const r=connect.apply(this,arguments);
    if(dest instanceof AudioDestinationNode&&dest.context.createMediaStreamDestination){
      let tap=taps.get(dest.context);
      if(!tap){tap=dest.context.createMediaStreamDestination();taps.set(dest.context,tap);window.__bvnAudioTaps.push(tap)}
      connect.call(this,tap);
    }
    return r;
  };
})();
</script>
<script src="ruffle/ruffle.js"></script>
<script>
const stage=document.getElementById("stage");
const render=document.getElementById("render");
const RENDER_MAX=900;   // widest layout size handed to Ruffle; anything larger is a compositor upscale
function fit(){
  const r=stage.getBoundingClientRect();
  const w=Math.min(r.width,r.height*1.5);           // fitted 3:2 size (stage is 3:2 except in fullscreen)
  const rw=Math.max(1,Math.min(w,RENDER_MAX));      // below 900px: render box == fitted box, scale 1
  const s=w/rw;
  const dx=Math.round((r.width-w)/2),dy=Math.round((r.height-w/1.5)/2);
  render.style.width=rw+"px";
  render.style.height=(rw*2/3)+"px";
  render.style.transform="translate("+dx+"px,"+dy+"px) scale("+s.toFixed(5)+")";
}
let fitTimer=0;
function refit(){clearTimeout(fitTimer);fitTimer=setTimeout(fit,100)}
fit();
window.addEventListener("resize",refit);
document.addEventListener("fullscreenchange",refit);
if(window.ResizeObserver)new ResizeObserver(refit).observe(stage);

const hint=document.getElementById("hint");
let p=null,hintLock=false;
function playing(on){
  if(hintLock)return;
  document.body.classList.toggle("is-playing",on);
  hint.textContent=on?"키보드 연결됨. 게임 밖을 클릭하면 끊깁니다.":"게임 화면을 한 번 클릭하면 키보드가 연결됩니다.";
}
function startGame(){
  p=window.RufflePlayer.newest().createPlayer();
  p.style.width="100%";p.style.height="100%";
  render.appendChild(p);
  p.load({url:"game.swf",base:"./"}).then(()=>{window.__loaded=true});
  p.addEventListener("focusin",()=>playing(true));
  p.addEventListener("focusout",()=>playing(false));
}
// A 원격 2P invite link (#join=CODE) opens the page as a guest: the guest only watches the host's game,
// so the local game is not started at all.
if(!/join=[A-Za-z0-9]{6}/.test(location.hash))startGame();
else hint.textContent="원격 2P 초대 링크로 열었어요. ‘원격 2P’의 ‘참가’를 누르세요.";
stage.addEventListener("pointerdown",()=>{if(p)playing(true)});
// Fullscreen the stage, not the player: the render box keeps its <=900px layout and is scaled up,
// so fullscreen stays as fast as windowed play. Ruffle's own enterFullscreen() is the fallback.
document.getElementById("fullscreen").addEventListener("click",()=>{
  const done=()=>{if(p&&p.focus)p.focus()};
  if(stage.requestFullscreen)stage.requestFullscreen({navigationUI:"hide"}).then(done,()=>p&&p.enterFullscreen());
  else if(p)p.enterFullscreen();
});
// Page contract for web/netplay.js (원격 2P).
window.BVN={
  stage,
  player:()=>p,
  dropPlayer(){if(p){p.remove();p=null}render.style.display="none"},
  setHint(text){hintLock=true;document.body.classList.add("is-playing");hint.textContent=text},
};
</script>
<script src="vendor/peerjs-1.5.5.min.js"></script>
<script src="netplay.js"></script>
</body>
